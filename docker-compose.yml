services:

  # ── INFRAESTRUTURA ────────────────────────────────────────────────────

  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - unihack-net
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=unihack
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - unihack-net
    restart: unless-stopped

  # ── APLICAÇÃO ─────────────────────────────────────────────────────────

  backend:
    build:
      context: ./unihack-backend/unihack
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/unihack
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${FRONTEND_URL}
    depends_on:
      - db
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=le
      - traefik.http.middlewares.strip-api.stripprefix.prefixes=/api
      - traefik.http.routers.backend.middlewares=strip-api
      - traefik.http.services.backend.loadbalancer.server.port=8080
    networks:
      - unihack-net
    restart: unless-stopped

  frontend:
    build:
      context: ../UniHackFrontend/unihack-frontend
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - unihack-net
    restart: unless-stopped

  # ── DESAFIOS (instâncias fixas, sempre ativas) ─────────────────────────

  desafio-sqli:
    build:
      context: ./desafios/sqli
      dockerfile: Dockerfile
    depends_on:
      - sqli-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.sqli.rule=Host(`${DOMAIN}`) && PathPrefix(`/lab/sqli`)
      - traefik.http.routers.sqli.entrypoints=websecure
      - traefik.http.routers.sqli.tls.certresolver=le
      - traefik.http.services.sqli.loadbalancer.server.port=80
    networks:
      - unihack-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  sqli-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${SQLI_DB_PASSWORD}
      - MYSQL_DATABASE=sqli
    volumes:
      - ./desafios/sqli/db:/docker-entrypoint-initdb.d
    networks:
      - unihack-net
    restart: unless-stopped

  desafio-xss:
    build:
      context: ./desafios/xss
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.xss.rule=Host(`${DOMAIN}`) && PathPrefix(`/lab/xss`)
      - traefik.http.routers.xss.entrypoints=websecure
      - traefik.http.routers.xss.tls.certresolver=le
      - traefik.http.services.xss.loadbalancer.server.port=80
    networks:
      - unihack-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  desafio-fonte-secreta:
    build:
      context: ./desafios/fonte-secreta
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.fonte-secreta.rule=Host(`${DOMAIN}`) && PathPrefix(`/lab/fonte-secreta`)
      - traefik.http.routers.fonte-secreta.entrypoints=websecure
      - traefik.http.routers.fonte-secreta.tls.certresolver=le
      - traefik.http.services.fonte-secreta.loadbalancer.server.port=80
    networks:
      - unihack-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32m
          cpus: "0.10"

  desafio-cmd-injection:
    build:
      context: ./desafios/command-injection
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.cmd-injection.rule=Host(`${DOMAIN}`) && PathPrefix(`/lab/cmd-injection`)
      - traefik.http.routers.cmd-injection.entrypoints=websecure
      - traefik.http.routers.cmd-injection.tls.certresolver=le
      - traefik.http.services.cmd-injection.loadbalancer.server.port=80
    networks:
      - unihack-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  desafio-jwt-inseguro:
    build:
      context: ./desafios/jwt-inseguro
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.jwt-inseguro.rule=Host(`${DOMAIN}`) && PathPrefix(`/lab/jwt-inseguro`)
      - traefik.http.routers.jwt-inseguro.entrypoints=websecure
      - traefik.http.routers.jwt-inseguro.tls.certresolver=le
      - traefik.http.services.jwt-inseguro.loadbalancer.server.port=80
    networks:
      - unihack-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

volumes:
  db-data:
  letsencrypt:

networks:
  unihack-net:
    driver: bridge

services:

  # ── INFRAESTRUTURA ────────────────────────────────────────────────────

  traefik:
    image: traefik:v2.11
    container_name: traefik-dev
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=ERROR
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - unihack-net

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=unihack
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      # Sem este volume os dados ficam na camada gravável do container e
      # somem num `docker compose down` — junto com os desafios cadastrados
      # e o usuário ADMIN, que são recriados na mão.
      - db-dev-data:/var/lib/postgresql/data
    networks:
      - unihack-net

  sqli-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=sqli
    volumes:
      - ./desafios/sqli/db:/docker-entrypoint-initdb.d
    networks:
      - unihack-net

  # ── APLICAÇÃO ────────────────────────────────────────────────────────

  backend:
    build:
      context: ./unihack-backend/unihack
      dockerfile: Dockerfile
    environment:
      # Dentro da rede do compose o Postgres atende em db:5432 — a porta 5433
      # é só o mapeamento para o host, não vale aqui.
      - DATABASE_URL=jdbc:postgresql://db:5432/unihack
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
    depends_on:
      - db
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=PathPrefix(`/api`)
      - traefik.http.routers.backend.entrypoints=web
      # O backend expõe /auth, /challenges e /users na raiz, então o /api
      # precisa ser removido antes de repassar a requisição.
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/api
      - traefik.http.routers.backend.middlewares=api-strip
      - traefik.http.services.backend.loadbalancer.server.port=8080
    networks:
      - unihack-net

  frontend:
    build:
      context: ../UniHackFrontend/unihack-frontend
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      # Rota catch-all: pega tudo que não casou com /api nem /lab/*.
      # A prioridade 1 (a mais baixa) garante que ela seja avaliada por
      # último — sem isso o frontend engoliria as rotas do backend e dos labs.
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80
    networks:
      - unihack-net

  # ── DESAFIOS ─────────────────────────────────────────────────────────

  desafio-sqli:
    build:
      context: ./desafios/sqli
      dockerfile: Dockerfile
    depends_on:
      - sqli-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.sqli.rule=PathPrefix(`/lab/sqli`)
      - traefik.http.routers.sqli.entrypoints=web
      - traefik.http.middlewares.sqli-strip.stripprefix.prefixes=/lab/sqli
      - traefik.http.routers.sqli.middlewares=sqli-strip
      - traefik.http.services.sqli.loadbalancer.server.port=80
    networks:
      - unihack-net

  desafio-xss:
    build:
      context: ./desafios/xss
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.xss.rule=PathPrefix(`/lab/xss`)
      - traefik.http.routers.xss.entrypoints=web
      - traefik.http.middlewares.xss-strip.stripprefix.prefixes=/lab/xss
      - traefik.http.routers.xss.middlewares=xss-strip
      - traefik.http.services.xss.loadbalancer.server.port=80
    networks:
      - unihack-net

  desafio-fonte-secreta:
    build:
      context: ./desafios/fonte-secreta
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.fonte-secreta.rule=PathPrefix(`/lab/fonte-secreta`)
      - traefik.http.routers.fonte-secreta.entrypoints=web
      - traefik.http.middlewares.fonte-strip.stripprefix.prefixes=/lab/fonte-secreta
      - traefik.http.routers.fonte-secreta.middlewares=fonte-strip
      - traefik.http.services.fonte-secreta.loadbalancer.server.port=80
    networks:
      - unihack-net

  desafio-cmd-injection:
    build:
      context: ./desafios/command-injection
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.cmd-injection.rule=PathPrefix(`/lab/cmd-injection`)
      - traefik.http.routers.cmd-injection.entrypoints=web
      - traefik.http.middlewares.cmd-strip.stripprefix.prefixes=/lab/cmd-injection
      - traefik.http.routers.cmd-injection.middlewares=cmd-strip
      - traefik.http.services.cmd-injection.loadbalancer.server.port=80
    networks:
      - unihack-net

  desafio-jwt-inseguro:
    build:
      context: ./desafios/jwt-inseguro
      dockerfile: Dockerfile
    labels:
      - traefik.enable=true
      - traefik.http.routers.jwt-inseguro.rule=PathPrefix(`/lab/jwt-inseguro`)
      - traefik.http.routers.jwt-inseguro.entrypoints=web
      - traefik.http.middlewares.jwt-strip.stripprefix.prefixes=/lab/jwt-inseguro
      - traefik.http.routers.jwt-inseguro.middlewares=jwt-strip
      - traefik.http.services.jwt-inseguro.loadbalancer.server.port=80
    networks:
      - unihack-net

volumes:
  db-dev-data:

networks:
  unihack-net:
    driver: bridge

spring.application.name=unihack
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/unihack}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET:SuaChaveSecretaMuitoLongaESeguraParaUniHack2025FacaElaForte!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}
